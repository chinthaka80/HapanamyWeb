name: Deploy Hapanamy to Hetzner

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'nexus_backend/**'
      - 'nexus_migrations/**'
      - 'assets/nexus/**'
      - 'nexus_*.html'
      - 'NEXUS_PRIME_*.md'
      - '.env.nexus*'
      - 'test/nexus*'
      - '.github/workflows/deploy-nexus.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SFTP_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          # Strip Windows CRLF (\r) characters to prevent OpenSSH parsing failures
          sed -i 's/\r$//' ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SFTP_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to Hetzner via SFTP (lftp)
        run: |
          sudo apt-get update && sudo apt-get install -y lftp
          lftp -c "
            set sftp:private-key ~/.ssh/id_rsa;
            set sftp:connect-program 'ssh -a -x -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o PasswordAuthentication=no -o PubkeyAuthentication=yes';
            connect sftp://${{ secrets.SFTP_USERNAME }}:@${{ secrets.SFTP_HOST }};
            mirror -R -v --delete --ignore-time \
              --exclude .git/ \
              --exclude .github/ \
              --exclude node_modules/ \
              --exclude 'nexus' \
              --exclude 'NEXUS' \
              --exclude-glob 'nexus_*' \
              --exclude-glob 'assets/nexus*' \
              --exclude-glob 'NEXUS_PRIME_*' \
              --exclude-glob '.env.nexus*' \
              --exclude-glob 'test/nexus*' \
              ./ /public_html
          "
          # Hapanamy deployment with Nexus Prime exclusion protection

      - name: Restart Node.js Backend Service via SSH
        continue-on-error: true
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ${{ secrets.SFTP_USERNAME }}@${{ secrets.SFTP_HOST }} "
            cd /public_html 2>/dev/null || cd ~/public_html 2>/dev/null || cd .
            if command -v pm2 >/dev/null 2>&1; then
              pm2 restart server.js || pm2 restart hapanamy-backend || pm2 start server.js --name hapanamy-backend || pm2 reload all || true
            elif command -v node >/dev/null 2>&1; then
              pkill -f 'node server.js' || true
              nohup node server.js > server.log 2>&1 &
            fi
          " || echo "SSH command execution non-fatal fallback"

