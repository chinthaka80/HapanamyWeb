name: Deploy Hapanamy to Hetzner

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SFTP_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          # Strip Windows CRLF (\r) characters to prevent OpenSSH parsing failures
          sed -i 's/\r$//' ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SFTP_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to Hetzner via SFTP (lftp)
        run: |
          sudo apt-get update && sudo apt-get install -y lftp
          lftp -c "
            set sftp:private-key ~/.ssh/id_rsa;
            set sftp:connect-program 'ssh -a -x -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o PasswordAuthentication=no -o PubkeyAuthentication=yes';
            connect sftp://${{ secrets.SFTP_USERNAME }}:@${{ secrets.SFTP_HOST }};
            mirror -R -v --delete --ignore-time --exclude .git/ --exclude .github/ --exclude node_modules/ ./ /public_html
          "
