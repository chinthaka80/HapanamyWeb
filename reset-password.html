<!DOCTYPE html>
<html lang="si">
<head>
    <!-- Favicon & Touch Icons -->
    <link rel="icon" type="image/jpeg" href="assets/logo.jpg">
    <link rel="apple-touch-icon" href="assets/logo.jpg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hapanamy.lk | මුරපදය නැවත සැකසීම | NOWATRIX Global</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&family=Noto+Sans+Sinhala:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
    <style>
        body {
            font-family: 'Poppins', 'Noto Sans Sinhala', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container-box {
            width: 100%;
            max-width: 420px;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 13.5px;
            font-weight: 700;
            color: var(--text-secondary);
        }
        .form-control {
            width: 100%;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: var(--bg-main);
            color: var(--text-primary);
            font-size: 14px;
            font-weight: 600;
        }
        .btn-submit {
            width: 100%;
            padding: 14px;
            border-radius: 30px;
            background: linear-gradient(135deg, var(--brand-orange), var(--brand-gold));
            color: white;
            border: none;
            font-weight: 800;
            font-size: 15px;
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        .btn-submit:hover {
            transform: scale(1.02);
        }
    </style>
    <meta name="google-site-verification" content="tHlXEC0dNN4fqkvHR4zrQMOgAoFGnW_oFx-wT8YTjfs" />
    <!-- Supabase Cloud DB Core -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="db.js"></script>
</head>
<body>
    <div class="container-box">
        <div style="text-align: center; margin-bottom: 20px;">
            <img src="assets/logo.jpg" alt="Hapanamy Logo" style="width: 50px; height: 50px; border-radius: 12px; border: 2px solid var(--brand-gold);">
        </div>
        <h2 style="font-size: 24px; font-weight: 800; margin-bottom: 8px; text-align: center;">මුරපදය නැවත සකසන්න</h2>
        <p style="color: var(--text-secondary); font-size: 13px; margin-bottom: 24px; text-align: center;">ඔබගේ සත්‍යාපන Token එක සහ නව මුරපදය ඇතුළත් කරන්න.</p>
        
        <div id="resetToast" style="display: none; padding: 12px 16px; border-radius: 10px; font-size: 13px; font-weight: 600; margin-bottom: 18px;"></div>

        <form id="resetForm">
            <div class="form-group">
                <label>Verification Token</label>
                <input type="text" id="token" class="form-control" required placeholder="Paste token here">
            </div>

            <div class="form-group">
                <label>නව මුරපදය (New Password)</label>
                <input type="password" id="newPassword" class="form-control" required placeholder="••••••••" minlength="6">
            </div>

            <div class="form-group">
                <label>මුරපදය තහවුරු කරන්න (Confirm Password)</label>
                <input type="password" id="confirmPassword" class="form-control" required placeholder="••••••••" minlength="6">
            </div>

            <button type="submit" id="btnSubmit" class="btn-submit">
                <span>🔐 මුරපදය වෙනස් කරන්න</span>
            </button>
        </form>

        <div style="text-align: center; margin-top: 20px; font-size: 13px;">
            <a href="login.html" style="color: var(--brand-orange); text-decoration: none; font-weight: 700;">← ආපසු Login පිටුවට</a>
        </div>

        <div style="margin-top: 15px; border-top: 1px dashed rgba(212, 175, 55, 0.2); padding-top: 12px; font-size: 11px; color: var(--text-muted); display: flex; align-items: center; justify-content: center; gap: 6px;">
            <img src="assets/brand/nowatrix/nowatrix_global_logo.jpg" alt="NOWATRIX Global" style="height: 16px; width: auto; object-fit: contain; border-radius: 3px;">
            <span>A <strong>NOWATRIX Global</strong> Company</span>
        </div>
    </div>

    <script>
        const toast = document.getElementById('resetToast');
        const btnSubmit = document.getElementById('btnSubmit');

        function showToast(msg, isError = true) {
            toast.style.display = 'block';
            toast.style.background = isError ? 'rgba(239, 68, 68, 0.15)' : 'rgba(34, 197, 94, 0.15)';
            toast.style.border = isError ? '1px solid rgba(239, 68, 68, 0.4)' : '1px solid rgba(34, 197, 94, 0.4)';
            toast.style.color = isError ? '#ff7675' : '#55efc4';
            toast.innerHTML = msg;
        }

        // Extract token from URL if present
        const urlParams = new URLSearchParams(window.location.search);
        const tokenVal = urlParams.get('token') || sessionStorage.getItem('hapanamy_reset_token') || '';
        if (tokenVal) {
            document.getElementById('token').value = tokenVal;
        }

        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            toast.style.display = 'none';

            const token = document.getElementById('token').value.trim();
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (newPassword.length < 6) {
                showToast('⚠️ මුරපදය සඳහා අවම වශයෙන් අක්ෂර 6ක් ඇතුළත් කරන්න.');
                return;
            }

            if (newPassword !== confirmPassword) {
                showToast('❌ මුරපද නොගැලපේ (Passwords do not match).');
                return;
            }

            btnSubmit.disabled = true;
            btnSubmit.innerHTML = '<span>⏳ වෙනස් කරමින්...</span>';

            // 1. Try Backend API (reset-confirm or reset-password)
            try {
                const response = await fetch('/api/auth/password/reset-confirm', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, newPassword })
                });
                
                const data = await response.json();
                if (response.ok && data.success) {
                    showToast('🎉 <strong>මුරපදය සාර්ථකව වෙනස් කරන ලදී!</strong> Login පිටුවට යොමු කරමින්...', false);
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 1500);
                    return;
                } else if (data.error) {
                    showToast(`❌ ${data.error}`);
                    btnSubmit.disabled = false;
                    btnSubmit.innerHTML = '<span>🔐 මුරපදය වෙනස් කරන්න</span>';
                    return;
                }
            } catch (err) {
                console.log('Backend API offline, applying local database update...');
            }

            // 2. Local Fallback
            try {
                const resetEmail = sessionStorage.getItem('hapanamy_reset_email');
                let regUsers = JSON.parse(localStorage.getItem('hapanamy_registered_users')) || [];
                
                if (resetEmail) {
                    regUsers = regUsers.map(u => {
                        if (u.email && u.email.toLowerCase() === resetEmail.toLowerCase()) {
                            return { ...u, password: newPassword };
                        }
                        return u;
                    });
                    localStorage.setItem('hapanamy_registered_users', JSON.stringify(regUsers));
                    if (typeof dbUpdateUser === 'function') {
                        await dbUpdateUser(resetEmail, { password: newPassword });
                    }
                }

                showToast('🎉 <strong>මුරපදය සාර්ථකව වෙනස් කරන ලදී!</strong> Login පිටුවට යොමු කරමින්...', false);
                sessionStorage.removeItem('hapanamy_reset_token');
                sessionStorage.removeItem('hapanamy_reset_email');
                
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 1500);
            } catch (e2) {
                btnSubmit.disabled = false;
                btnSubmit.innerHTML = '<span>🔐 මුරපදය වෙනස් කරන්න</span>';
                showToast('❌ තාක්ෂණික දෝෂයක්. කරුණාකර නැවත උත්සාහ කරන්න.');
            }
        });
    </script>
</body>
</html>
