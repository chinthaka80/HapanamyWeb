<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hapanamy - Reset Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&family=Noto+Sans+Sinhala:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
    <style>
        body {
            font-family: 'Poppins', 'Noto Sans Sinhala', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container-box {
            width: 100%;
            max-width: 420px;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 13.5px;
            font-weight: 700;
            color: var(--text-secondary);
        }
        .form-control {
            width: 100%;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: var(--bg-main);
            color: var(--text-primary);
            font-size: 14px;
            font-weight: 600;
        }
        .btn-submit {
            width: 100%;
            padding: 14px;
            border-radius: 30px;
            background: linear-gradient(135deg, var(--brand-orange), var(--brand-gold));
            color: white;
            border: none;
            font-weight: 800;
            font-size: 15px;
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        .btn-submit:hover {
            transform: scale(1.02);
        }
    </style>
</head>
<body>
    <div class="container-box">
        <h2 style="font-size: 26px; font-weight: 900; margin-bottom: 8px;">මුරපදය නැවත සකසන්න</h2>
        <p style="color: var(--text-secondary); font-size: 13.5px; margin-bottom: 30px;">ඔබට ලැබුණු සබැඳි Token එක සහ නව මුරපදය ඇතුළත් කරන්න.</p>
        
        <form id="resetForm">
            <div class="form-group">
                <label>Verification Token</label>
                <input type="text" id="token" class="form-control" required placeholder="Paste token here">
            </div>

            <div class="form-group">
                <label>නව මුරපදය (New Password)</label>
                <input type="password" id="newPassword" class="form-control" required placeholder="••••••••">
            </div>

            <button type="submit" class="btn-submit">මුරපදය වෙනස් කරන්න</button>
        </form>
    </div>

    <script>
        // Extract token from URL if present
        const urlParams = new URLSearchParams(window.location.search);
        const tokenVal = urlParams.get('token') || '';
        if (tokenVal) {
            document.getElementById('token').value = tokenVal;
        }

        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                token: document.getElementById('token').value,
                newPassword: document.getElementById('newPassword').value
            };

            try {
                const response = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const data = await response.json();
                if (response.ok) {
                    alert('🎉 මුරපදය සාර්ථකව වෙනස් කරන ලදී! (Password reset successful)');
                    window.location.href = 'login.html';
                } else {
                    alert('❌ ' + (data.error || 'නැවත සැකසීම අසාර්ථකයි.'));
                }
            } catch (err) {
                alert('❌ Error: ' + err.message);
            }
        });
    </script>
</body>
</html>
