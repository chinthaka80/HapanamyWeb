<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hapanamy - Forgot Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&family=Noto+Sans+Sinhala:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
    <style>
        body {
            font-family: 'Poppins', 'Noto Sans Sinhala', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container-box {
            width: 100%;
            max-width: 420px;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 13.5px;
            font-weight: 700;
            color: var(--text-secondary);
        }
        .form-control {
            width: 100%;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: var(--bg-main);
            color: var(--text-primary);
            font-size: 14px;
            font-weight: 600;
        }
        .btn-submit {
            width: 100%;
            padding: 14px;
            border-radius: 30px;
            background: linear-gradient(135deg, var(--brand-orange), var(--brand-gold));
            color: white;
            border: none;
            font-weight: 800;
            font-size: 15px;
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        .btn-submit:hover {
            transform: scale(1.02);
        }
    </style>
</head>
<body>
    <div class="container-box">
        <h2 style="font-size: 26px; font-weight: 900; margin-bottom: 8px;">මුරපදය අමතකද?</h2>
        <p style="color: var(--text-secondary); font-size: 13.5px; margin-bottom: 30px;">ඔබේ ඊමේල් ලිපිනය ඇතුළත් කරන්න. අපි ඔබට මුරපදය නැවත සැකසීමට සබැඳියක් එවන්නෙමු.</p>
        
        <form id="forgotForm">
            <div class="form-group">
                <label>ඊමේල් ලිපිනය (Email Address)</label>
                <input type="email" id="email" class="form-control" required placeholder="example@hapanamy.lk">
            </div>

            <button type="submit" class="btn-submit">Reset Link එක එවන්න</button>
        </form>

        <p style="margin-top: 25px; text-align: center; font-size: 13.5px; font-weight: 700;">
            <a href="login.html" style="color: var(--brand-orange); text-decoration: none;">← ආපසු ලොගින් පිටුවට</a>
        </p>
    </div>

    <script>
        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;

            try {
                const response = await fetch('/api/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                
                const data = await response.json();
                if (response.ok) {
                    alert('🎉 ඊමේල් ලිපිනයක් පවතී නම් සබැඳිය සාර්ථකව යවා ඇත. (Reset email sent!)');
                    window.location.href = 'reset-password.html?email=' + encodeURIComponent(email);
                } else {
                    alert('❌ ' + (data.error || 'අසාර්ථකයි.'));
                }
            } catch (err) {
                alert('❌ Error: ' + err.message);
            }
        });
    </script>
</body>
</html>
