<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Favicon & Touch Icons -->
    <link rel="icon" type="image/jpeg" href="assets/logo.jpg">
    <link rel="apple-touch-icon" href="assets/logo.jpg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — Nexus Prime (PVT) Ltd</title>
    <meta name="description" content="Request a password reset link for your Nexus Prime member account.">
    <link rel="canonical" href="https://nexusp.online/forgot-password">
    <link rel="stylesheet" href="/assets/nexus/nexus-style.css">
    <meta name="google-site-verification" content="tHlXEC0dNN4fqkvHR4zrQMOgAoFGnW_oFx-wT8YTjfs" />
</head>
<body>

    <!-- Header Navigation -->
    <header class="nexus-header">
        <div class="nexus-container nexus-header-content">
            <a href="/" class="nexus-logo-wrapper" aria-label="Nexus Prime Home">
                <div class="nexus-logo-mark">NP</div>
                <div class="nexus-logo-text">
                    <div class="nexus-logo-name">NEXUS <span>PRIME</span></div>
                    <div class="nexus-logo-corp">Nexus Prime (PVT) Ltd</div>
                </div>
            </a>
            <nav class="nexus-nav-links">
                <a href="/">Home</a>
                <a href="/login" class="nexus-btn nexus-btn-outline nexus-btn-sm">Sign In</a>
            </nav>
        </div>
    </header>

    <!-- Main Recovery Container -->
    <main class="nexus-container" style="padding-top:40px; padding-bottom:60px;">
        <div class="nexus-card nexus-auth-box" style="max-width:480px;">
            <div style="text-align:center; margin-bottom:24px;">
                <div style="font-size:36px; margin-bottom:12px;">🔑</div>
                <h1 style="font-size:24px; font-weight:800; margin-bottom:6px;">Reset Your Password</h1>
                <p style="color:var(--text-muted); font-size:13.5px;">
                    Enter your registered email address and we will send you secure recovery instructions.
                </p>
            </div>

            <!-- Alert Message Box -->
            <div id="alertBox" style="display:none;" class="nexus-alert" role="alert"></div>

            <form id="forgotPasswordForm" onsubmit="handleForgotPassword(event)" novalidate>
                <div class="nexus-form-group">
                    <label class="nexus-label" for="recoveryEmail">Email Address</label>
                    <input 
                        type="email" 
                        id="recoveryEmail" 
                        class="nexus-input" 
                        placeholder="name@domain.com" 
                        required 
                        autocomplete="email"
                        aria-required="true">
                </div>

                <button type="submit" id="resetBtn" class="nexus-btn nexus-btn-primary" style="width:100%; margin-top:10px;">
                    Send Reset Link &rarr;
                </button>
            </form>

            <div style="text-align:center; margin-top:24px; font-size:13px; color:var(--text-muted);">
                Remembered your password? <a href="/login" style="color:var(--accent); font-weight:700; text-decoration:none;">Back to Sign In</a>
            </div>
        </div>
    </main>

    <script>
        function handleForgotPassword(e) {
            e.preventDefault();
            const emailInput = document.getElementById('recoveryEmail');
            const alertBox = document.getElementById('alertBox');
            const btn = document.getElementById('resetBtn');

            if (!emailInput.value.trim()) {
                alertBox.className = 'nexus-alert nexus-alert-error';
                alertBox.innerText = 'Please provide your account email address.';
                alertBox.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.innerText = 'Sending Link...';

            setTimeout(() => {
                alertBox.className = 'nexus-alert nexus-alert-success';
                alertBox.innerText = 'If an account matches that email address, password reset instructions have been dispatched. Please check your inbox.';
                alertBox.style.display = 'block';
                emailInput.value = '';
                btn.disabled = false;
                btn.innerText = 'Send Reset Link →';
            }, 800);
        }
    </script>
</body>
</html>
