<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hapanamy - Login | ඇතුල් වන්න</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&family=Noto+Sans+Sinhala:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
    <style>
        body {
            font-family: 'Poppins', 'Noto Sans Sinhala', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .login-container {
            width: 100%;
            max-width: 420px;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 13.5px;
            font-weight: 700;
            color: var(--text-secondary);
        }
        .form-control {
            width: 100%;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: var(--bg-main);
            color: var(--text-primary);
            font-size: 14px;
            font-weight: 600;
        }
        .btn-login {
            width: 100%;
            padding: 14px;
            border-radius: 30px;
            background: linear-gradient(135deg, var(--brand-orange), var(--brand-gold));
            color: white;
            border: none;
            font-weight: 800;
            font-size: 15px;
            cursor: pointer;
            transition: transform 0.2s ease;
            margin-top: 10px;
        }
        .btn-login:hover {
            transform: scale(1.02);
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2 style="font-size: 26px; font-weight: 900; margin-bottom: 8px;">ඇතුල් වන්න | Login</h2>
        <p style="color: var(--text-secondary); font-size: 13.5px; margin-bottom: 30px;">Hapanamy Portal වෙත පිවිසීමට ඔබගේ විස්තර ඇතුළත් කරන්න.</p>
        
        <form id="loginForm">
            <div class="form-group">
                <label>ඊමේල් ලිපිනය (Email Address)</label>
                <input type="email" id="email" class="form-control" required placeholder="admin@hapanamy.lk">
            </div>

            <div class="form-group">
                <label style="display: flex; justify-content: space-between; align-items: center;">
                    <span>මුරපදය (Password)</span>
                    <a href="forgot-password.html" style="color: var(--brand-orange); font-size: 12px; text-decoration: none;">මුරපදය අමතකද?</a>
                </label>
                <input type="password" id="password" class="form-control" required placeholder="••••••••">
            </div>

            <button type="submit" class="btn-login">පිවිසෙන්න (Login)</button>
        </form>

        <p style="margin-top: 25px; text-align: center; font-size: 13.5px; font-weight: 700;">
            නව සාමාජිකයෙක්ද? <a href="register.html" style="color: var(--brand-orange);">ලියාපදිංචි වන්න</a>
        </p>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const payload = {
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            };

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const data = await response.json();
                if (response.ok) {
                    localStorage.setItem('auth_token', data.token);
                    localStorage.setItem('active_user', JSON.stringify(data.user));
                    
                    alert('👑 සාර්ථකව පිවිසුණා! (Login Successful)');
                    window.location.href = 'dashboard.html';
                } else {
                    alert('❌ ' + (data.error || 'විස්තර වැරදියි.'));
                }
            } catch (err) {
                alert('❌ Connection failed: ' + err.message);
            }
        });
    </script>
</body>
</html>
