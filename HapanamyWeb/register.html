    <!-- Core styles -->
    <link rel="stylesheet" href="index.css">
    
    <style>
        :root {
            --brand-orange: #F47B20;
            --brand-gold: #D4AF37;
            --bg-main: #0B192C;
            --bg-surface: #102A43;
            --text-primary: #FFFFFF;
            --text-secondary: #E2E8F0;
            --text-muted: #94A3B8;
            --border-color: rgba(255, 255, 255, 0.12);
            --transition-smooth: all 0.25s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', 'Noto Sans Sinhala', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            position: relative;
            overflow-x: hidden;
        }

        .auth-bg-shapes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .auth-shape {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.25;
        }

        .auth-shape-1 {
            width: 450px;
            height: 450px;
            background: var(--brand-orange);
            top: -100px;
            left: -100px;
        }

        .auth-shape-2 {
            width: 400px;
            height: 400px;
            background: var(--brand-gold);
            bottom: -80px;
            right: -80px;
        }

        .register-card {
            width: 100%;
            max-width: 500px;
            background: rgba(16, 42, 67, 0.75);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 28px;
            padding: 40px 32px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5), 0 0 40px rgba(244, 123, 32, 0.1);
            position: relative;
            z-index: 10;
        }

        .auth-logo-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .auth-logo-header a {
            text-decoration: none;
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .auth-logo-img {
            width: 55px;
            height: 55px;
            border-radius: 14px;
            border: 2px solid var(--brand-gold);
            object-fit: cover;
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.3);
        }

        .auth-title {
            font-size: 22px;
            font-weight: 800;
            color: var(--text-primary);
            margin-top: 10px;
            margin-bottom: 4px;
        }

        .auth-subtitle {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .form-group {
            margin-bottom: 16px;
            position: relative;
            text-align: left;
        }

        .form-group label {
            display: block !important;
            margin-bottom: 6px !important;
            font-size: 13px !important;
            font-weight: 700 !important;
            color: var(--text-secondary) !important;
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: rgba(8, 28, 44, 0.85);
            color: var(--text-primary);
            font-size: 13.5px;
            font-weight: 600;
            outline: none;
            transition: var(--transition-smooth);
        }

        .form-control:focus {
            border-color: var(--brand-orange);
            box-shadow: 0 0 0 3px rgba(244, 123, 32, 0.2);
            background: rgba(8, 28, 44, 1);
        }

        .role-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }

        .role-btn {
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: rgba(8, 28, 44, 0.6);
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            transition: var(--transition-smooth);
        }

        .role-btn.active {
            border-color: var(--brand-orange);
            background: rgba(244, 123, 32, 0.15);
            color: #FFFFFF;
            box-shadow: 0 0 15px rgba(244, 123, 32, 0.2);
        }

        .terms-checkbox {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            font-size: 12.5px;
            color: var(--text-muted);
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .terms-checkbox input {
            margin-top: 3px;
            accent-color: var(--brand-orange);
        }

        .terms-checkbox a {
            color: var(--brand-gold);
            text-decoration: none;
        }

        .terms-checkbox a:hover {
            text-decoration: underline;
        }

        .btn-auth-submit {
            width: 100%;
            padding: 14px;
            border-radius: 30px;
            background: linear-gradient(135deg, var(--brand-orange), var(--brand-gold));
            color: white;
            border: none;
            font-weight: 800;
            font-size: 15px;
            cursor: pointer;
            transition: var(--transition-smooth);
            box-shadow: 0 8px 25px rgba(244, 123, 32, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-auth-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(244, 123, 32, 0.45);
        }

        .auth-toast {
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 18px;
            display: none;
        }

        .auth-toast-error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #ff7675;
        }

        .auth-toast-success {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.4);
            color: #55efc4;
        }

        .auth-footer {
            margin-top: 22px;
            text-align: center;
            font-size: 13px;
            color: var(--text-secondary);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 18px;
        }

        .auth-footer a {
            color: var(--brand-orange);
            font-weight: 700;
            text-decoration: none;
        }

        .home-back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12.5px;
            color: var(--text-secondary);
            text-decoration: none;
            margin-bottom: 16px;
            transition: color 0.2s ease;
        }

        .home-back-link:hover {
            color: var(--brand-gold);
        }

        @media (max-width: 550px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
    <!-- Supabase Cloud DB Core -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="db.js"></script>
    <meta name="google-adsense-account" content="ca-pub-8211523479069192">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8211523479069192" crossorigin="anonymous"></script>
</head>
<body>
    <div class="auth-bg-shapes">
        <div class="auth-shape auth-shape-1"></div>
        <div class="auth-shape auth-shape-2"></div>
    </div>

    <div class="register-card">
        <a href="index.html" class="home-back-link">
            ← ආපසු මුල් පිටුවට (Back to Home)
        </a>

        <div class="auth-logo-header">
            <a href="index.html">
                <img src="assets/logo.jpg" alt="Hapanamy Logo" class="auth-logo-img">
                <h1 class="auth-title">නොමිලේ ලියාපදිංචි වන්න</h1>
                <p class="auth-subtitle">ශ්‍රී ලංකාවේ ප්‍රමුඛතම Digital Skills Campus සමඟ එක්වන්න</p>
            </a>
        </div>

        <div id="authToast" class="auth-toast"></div>

        <form id="registerForm">
            <div class="form-group">
                <label for="fullName">සම්පූර්ණ නම (Full Name)</label>
                <input type="text" id="fullName" class="form-control" required placeholder="Kasun Perera" autocomplete="name">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="email">විද්‍යුත් තැපෑල (Email)</label>
                    <input type="email" id="email" class="form-control" required placeholder="name@example.com" autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="phone">දුරකථන අංකය (Mobile)</label>
                    <input type="tel" id="phone" class="form-control" required placeholder="07XXXXXXXX" autocomplete="tel">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="password">මුරපදය (Password)</label>
                    <input type="password" id="password" class="form-control" required placeholder="••••••••" autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label for="confirmPassword">මුරපදය තහවුරු කරන්න</label>
                    <input type="password" id="confirmPassword" class="form-control" required placeholder="••••••••" autocomplete="new-password">
                </div>
            </div>

            <div class="form-group">
                <label>ගිණුම් වර්ගය (Account Type)</label>
                <div class="role-selector">
                    <div class="role-btn active" id="roleStudent" onclick="selectRole('student')">
                        🎓 ශිෂ්‍ය (Student)
                    </div>
                    <div class="role-btn" id="roleAffiliate" onclick="selectRole('member')">
                        🤝 අනුබද්ධිත (Affiliate)
                    </div>
                </div>
            </div>

            <div class="terms-checkbox">
                <input type="checkbox" id="agreeTerms" required>
                <label for="agreeTerms">
                    මම Hapanamy.lk හි <a href="terms-conditions.html" target="_blank">සේවා කොන්දේසි</a> සහ <a href="privacy-policy.html" target="_blank">පුද්ගලිකත්ව ප්‍රතිපත්තියට</a> එකඟ වෙමි.
                </label>
            </div>

            <button type="submit" id="btnSubmit" class="btn-auth-submit">
                <span>🚀 ලියාපදිංචි වන්න (Create Account)</span>
            </button>
        </form>

        <div class="auth-footer">
            <span>දැනටමත් ගිණුමක් තිබේද?</span>
            <a href="login.html">පිවිසෙන්න (Sign In)</a>
        </div>
    </div>

    <script>
        let currentRole = 'student';
        const toast = document.getElementById('authToast');
        const registerForm = document.getElementById('registerForm');
        const btnSubmit = document.getElementById('btnSubmit');

        function selectRole(role) {
            currentRole = role;
            document.getElementById('roleStudent').classList.toggle('active', role === 'student');
            document.getElementById('roleAffiliate').classList.toggle('active', role === 'member');
        }

        function showToast(msg, isError = true) {
            toast.className = `auth-toast ${isError ? 'auth-toast-error' : 'auth-toast-success'}`;
            toast.innerHTML = msg;
            toast.style.display = 'block';
        }

        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            toast.style.display = 'none';

            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password.length < 6) {
                showToast('⚠️ මුරපදය සඳහා අවම වශයෙන් අක්ෂර 6ක් ඇතුළත් කරන්න.');
                return;
            }

            if (password !== confirmPassword) {
                showToast('❌ මුරපද නොගැලපේ (Passwords do not match). කරුණාකර නැවත පරීක්ෂා කරන්න.');
                return;
            }

            btnSubmit.disabled = true;
            btnSubmit.innerHTML = '<span>⏳ ලියාපදිංචි කරමින්...</span>';

            const username = email.split('@')[0].replace(/[^a-zA-Z0-9_-]/g, '_');
            const sponsorCode = localStorage.getItem('hapanamy_referrer') || 'Hiru';

            // 1. Try Backend API
            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        fullName,
                        username,
                        email,
                        mobile: phone,
                        password,
                        confirmPassword,
                        sponsorCode,
                        role: currentRole,
                        termsAccepted: true,
                        privacyAccepted: true
                    })
                });

                const contentType = response.headers.get('content-type') || '';
                if (contentType.includes('application/json')) {
                    const data = await response.json();
                    if (response.ok && data.success) {
                        localStorage.setItem('auth_token', data.verification_token || 'token-' + Date.now());
                        localStorage.setItem('active_token', data.verification_token || 'token-' + Date.now());
                        localStorage.setItem('active_user', JSON.stringify(data.user));
                        showToast(`🎉 <strong>ලියාපදිංචිය සාර්ථකයි!</strong> සාදරයෙන් පිළිගනිමු ${fullName}!`, false);
                        setTimeout(() => {
                            window.location.replace('dashboard.html');
                        }, 1000);
                        return;
                    } else if (data.error) {
                        btnSubmit.disabled = false;
                        btnSubmit.innerHTML = '<span>🚀 ලියාපදිංචි වන්න (Create Account)</span>';
                        showToast(`❌ <strong>ලියාපදිංචිය අසාර්ථකයි:</strong> ${data.error}`);
                        return;
                    }
                }
            } catch (err) {
                console.log('Backend API offline, falling back to local database.');
            }

            // 2. Local Fallback via db.js / localStorage
            try {
                let regUsers = JSON.parse(localStorage.getItem('hapanamy_registered_users')) || [];
                const exists = regUsers.some(u => u.email.toLowerCase() === email.toLowerCase());
                if (exists) {
                    btnSubmit.disabled = false;
                    btnSubmit.innerHTML = '<span>🚀 ලියාපදිංචි වන්න (Create Account)</span>';
                    showToast('⚠️ මෙම විද්‍යුත් තැපෑල (Email) දැනටමත් ලියාපදිංචි කර ඇත. කරුණාකර පිවිසෙන්න (Login).');
                    return;
                }

                const newUser = {
                    id: 'user-' + Date.now(),
                    name: fullName,
                    full_name: fullName,
                    username: username,
                    email: email,
                    phone: phone,
                    password: password,
                    role: currentRole,
                    status: 'ACTIVE',
                    created_at: new Date().toISOString()
                };

                regUsers.push(newUser);
                localStorage.setItem('hapanamy_registered_users', JSON.stringify(regUsers));

                if (typeof dbAddUser === 'function') {
                    await dbAddUser(newUser);
                }

                localStorage.setItem('auth_token', 'token-member-' + newUser.id);
                localStorage.setItem('active_token', 'token-member-' + newUser.id);
                localStorage.setItem('active_user', JSON.stringify(newUser));
                localStorage.setItem('hapanamy_user_profile', JSON.stringify(newUser));

                showToast(`🎉 <strong>ලියාපදිංචිය සාර්ථකයි!</strong> සාදරයෙන් පිළිගනිමු ${fullName}!`, false);
                setTimeout(() => {
                    window.location.replace('dashboard.html');
                }, 1000);
            } catch (e2) {
                btnSubmit.disabled = false;
                btnSubmit.innerHTML = '<span>🚀 ලියාපදිංචි වන්න (Create Account)</span>';
                showToast('❌ තාක්ෂණික දෝෂයක්. කරුණාකර නැවත උත්සාහ කරන්න.');
            }
        });
    </script>
</body>
</html>
