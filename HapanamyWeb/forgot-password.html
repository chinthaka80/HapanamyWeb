    <!-- Core styles -->
    <link rel="stylesheet" href="index.css">
    
    <style>
        :root {
            --brand-orange: #F47B20;
            --brand-gold: #D4AF37;
            --bg-main: #0B192C;
            --bg-surface: #102A43;
            --text-primary: #FFFFFF;
            --text-secondary: #E2E8F0;
            --text-muted: #94A3B8;
            --border-color: rgba(255, 255, 255, 0.12);
            --transition-smooth: all 0.25s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', 'Noto Sans Sinhala', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            position: relative;
            overflow-x: hidden;
        }

        .auth-bg-shapes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .auth-shape {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.25;
        }

        .auth-shape-1 {
            width: 450px;
            height: 450px;
            background: var(--brand-orange);
            top: -100px;
            left: -100px;
        }

        .auth-shape-2 {
            width: 400px;
            height: 400px;
            background: var(--brand-gold);
            bottom: -80px;
            right: -80px;
        }

        .auth-card {
            width: 100%;
            max-width: 460px;
            background: rgba(16, 42, 67, 0.75);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 28px;
            padding: 40px 32px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5), 0 0 40px rgba(244, 123, 32, 0.1);
            position: relative;
            z-index: 10;
        }

        .auth-logo-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .auth-logo-header a {
            text-decoration: none;
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .auth-logo-img {
            width: 55px;
            height: 55px;
            border-radius: 14px;
            border: 2px solid var(--brand-gold);
            object-fit: cover;
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.3);
        }

        .auth-title {
            font-size: 22px;
            font-weight: 800;
            color: var(--text-primary);
            margin-top: 10px;
            margin-bottom: 4px;
        }

        .auth-subtitle {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
            text-align: left;
        }

        .form-group label {
            display: block !important;
            margin-bottom: 8px !important;
            font-size: 13.5px !important;
            font-weight: 700 !important;
            color: var(--text-secondary) !important;
        }

        .form-control {
            width: 100%;
            padding: 13px 18px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: rgba(8, 28, 44, 0.85);
            color: var(--text-primary);
            font-size: 14px;
            font-weight: 600;
            outline: none;
            transition: var(--transition-smooth);
        }

        .form-control:focus {
            border-color: var(--brand-orange);
            box-shadow: 0 0 0 3px rgba(244, 123, 32, 0.2);
            background: rgba(8, 28, 44, 1);
        }

        .btn-auth-submit {
            width: 100%;
            padding: 14px;
            border-radius: 30px;
            background: linear-gradient(135deg, var(--brand-orange), var(--brand-gold));
            color: white;
            border: none;
            font-weight: 800;
            font-size: 15px;
            cursor: pointer;
            transition: var(--transition-smooth);
            box-shadow: 0 8px 25px rgba(244, 123, 32, 0.35);
            margin-top: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-auth-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(244, 123, 32, 0.45);
        }

        .auth-toast {
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 20px;
            display: none;
        }

        .auth-toast-error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #ff7675;
        }

        .auth-toast-success {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.4);
            color: #55efc4;
        }

        .auth-footer {
            margin-top: 25px;
            text-align: center;
            font-size: 13.5px;
            color: var(--text-secondary);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 20px;
        }

        .auth-footer a {
            color: var(--brand-orange);
            font-weight: 700;
            text-decoration: none;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        .home-back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12.5px;
            color: var(--text-secondary);
            text-decoration: none;
            margin-bottom: 18px;
            transition: color 0.2s ease;
        }

        .home-back-link:hover {
            color: var(--brand-gold);
        }

        .whatsapp-help {
            background: rgba(37, 211, 102, 0.1);
            border: 1px solid rgba(37, 211, 102, 0.3);
            border-radius: 14px;
            padding: 16px;
            margin-top: 20px;
            text-align: center;
        }

        .whatsapp-help p {
            font-size: 12.5px;
            color: var(--text-secondary);
            margin-bottom: 10px;
        }

        .whatsapp-help a {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #25D366;
            font-weight: 700;
            font-size: 13.5px;
            text-decoration: none;
        }
    </style>
    <!-- Supabase Cloud DB Core -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="db.js"></script>
    <meta name="google-adsense-account" content="ca-pub-8211523479069192">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8211523479069192" crossorigin="anonymous"></script>
    <meta name="google-site-verification" content="tHlXEC0dNN4fqkvHR4zrQMOgAoFGnW_oFx-wT8YTjfs" />

<body>
    <div class="auth-bg-shapes">
        <div class="auth-shape auth-shape-1"></div>
        <div class="auth-shape auth-shape-2"></div>
    </div>

    <div class="auth-card">
        <a href="login.html" class="home-back-link">
            ← ආපසු පිවිසුම් පිටුවට (Back to Login)
        </a>

        <div class="auth-logo-header">
            <a href="index.html">
                <img src="assets/logo.jpg" alt="Hapanamy Logo" class="auth-logo-img">
                <h1 class="auth-title">මුරපදය නැවත සැකසීම</h1>
                <p class="auth-subtitle">ඔබගේ ගිණුමට ලියාපදිංචි ඊමේල් ලිපිනය ඇතුළත් කරන්න.</p>
            </a>
        </div>

        <div id="authToast" class="auth-toast"></div>

        <form id="forgotForm">
            <div class="form-group">
                <label for="email">විද්‍යුත් තැපෑල (Email Address)</label>
                <div class="form-input-wrap">
                    <input type="email" id="email" class="form-control" required placeholder="name@example.com" autocomplete="email">
                </div>
            </div>

            <button type="submit" id="btnSubmit" class="btn-auth-submit">
                <span>🔑 Reset Link එක ලබාගන්න</span>
            </button>
        </form>

        <div class="whatsapp-help">
            <p>ක්ෂණික පාරිභෝගික සහාය හෝ මුරපද ගැටලු සඳහා අපගේ නිල WhatsApp අංකය අමතන්න:</p>
            <a href="https://wa.me/94726090050?text=Hello%20Hapanamy%20Support,%20I%20need%20help%20resetting%20my%20account%20password." target="_blank">
                <span>💬 WhatsApp සහාය (+94 72 609 0050)</span>
            </a>
        </div>

        <div class="auth-footer">
            <span>මුරපදය මතකද?</span>
            <a href="login.html">පිවිසෙන්න (Sign In)</a>
        </div>
    </div>

    <script>
        const toast = document.getElementById('authToast');
        const forgotForm = document.getElementById('forgotForm');
        const btnSubmit = document.getElementById('btnSubmit');

        function showToast(msg, isError = true) {
            toast.className = `auth-toast ${isError ? 'auth-toast-error' : 'auth-toast-success'}`;
            toast.innerHTML = msg;
            toast.style.display = 'block';
        }

        forgotForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            toast.style.display = 'none';

            const email = document.getElementById('email').value.trim();
            if (!email) {
                showToast('⚠️ කරුණාකර ඔබගේ විද්‍යුත් තැපෑල ඇතුළත් කරන්න.');
                return;
            }

            btnSubmit.disabled = true;
            btnSubmit.innerHTML = '<span>⏳ යොමු කරමින්...</span>';

            // Simulate / Backend link dispatch
            setTimeout(() => {
                showToast('✅ <strong>මුරපදය නැවත සැකසීමේ සබැඳිය යොමු කරන ලදී!</strong> ඔබගේ ඊමේල් ගිණුම පරීක්ෂා කර නව මුරපදයක් සකසන්න. ගැටලුවක් ඇත්නම් පහත WhatsApp සහාය අමතන්න.', false);
                btnSubmit.disabled = false;
                btnSubmit.innerHTML = '<span>🔑 Reset Link එක නැවත යවන්න</span>';
            }, 1200);
        });
    </script>
</body>
