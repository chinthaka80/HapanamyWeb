    <style>
        :root {
            --brand-orange: #F47B20;
            --brand-gold: #D4AF37;
            --bg-main: #0B192C;
            --bg-surface: #102A43;
            --text-primary: #FFFFFF;
            --text-secondary: #E2E8F0;
            --text-muted: #94A3B8;
            --border-color: rgba(255, 255, 255, 0.12);
            --transition-smooth: all 0.25s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', 'Noto Sans Sinhala', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            position: relative;
            overflow-x: hidden;
        }

        .auth-bg-shapes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .auth-shape {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.25;
        }

        .auth-shape-1 {
            width: 450px;
            height: 450px;
            background: var(--brand-orange);
            top: -100px;
            left: -100px;
        }

        .auth-shape-2 {
            width: 400px;
            height: 400px;
            background: var(--brand-gold);
            bottom: -80px;
            right: -80px;
        }

        .register-card {
            width: 100%;
            max-width: 500px;
            background: rgba(16, 42, 67, 0.75);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 28px;
            padding: 40px 32px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5), 0 0 40px rgba(244, 123, 32, 0.1);
            position: relative;
            z-index: 10;
        }

        .auth-logo-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .auth-logo-header a {
            text-decoration: none;
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .auth-logo-img {
            width: 55px;
            height: 55px;
            border-radius: 14px;
            border: 2px solid var(--brand-gold);
            object-fit: cover;
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.3);
        }

        .auth-title {
            font-size: 22px;
            font-weight: 800;
            color: var(--text-primary);
            margin-top: 10px;
            margin-bottom: 4px;
        }

        .auth-subtitle {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .form-group {
            margin-bottom: 16px;
            position: relative;
            text-align: left;
        }

        .form-group label {
            display: block !important;
            margin-bottom: 6px !important;
            font-size: 13px !important;
            font-weight: 700 !important;
            color: var(--text-secondary) !important;
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: rgba(8, 28, 44, 0.85);
            color: var(--text-primary);
            font-size: 13.5px;
            font-weight: 600;
            outline: none;
            transition: var(--transition-smooth);
        }

        .form-control:focus {
            border-color: var(--brand-orange);
            box-shadow: 0 0 0 3px rgba(244, 123, 32, 0.2);
            background: rgba(8, 28, 44, 1);
        }

        .role-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }

        .role-btn {
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: rgba(8, 28, 44, 0.6);
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            transition: var(--transition-smooth);
        }

        .role-btn.active {
            border-color: var(--brand-orange);
            background: rgba(244, 123, 32, 0.15);
            color: #FFFFFF;
            box-shadow: 0 0 15px rgba(244, 123, 32, 0.2);
        }

        .terms-checkbox {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            font-size: 12.5px;
            color: var(--text-muted);
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .terms-checkbox input {
            margin-top: 3px;
            accent-color: var(--brand-orange);
        }

        .terms-checkbox a {
            color: var(--brand-gold);
            text-decoration: none;
        }

        .terms-checkbox a:hover {
            text-decoration: underline;
        }

        .btn-auth-submit {
            width: 100%;
            padding: 14px;
            border-radius: 30px;
            background: linear-gradient(135deg, var(--brand-orange), var(--brand-gold));
            color: white;
            border: none;
            font-weight: 800;
            font-size: 15px;
            cursor: pointer;
            transition: var(--transition-smooth);
            box-shadow: 0 8px 25px rgba(244, 123, 32, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-auth-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(244, 123, 32, 0.45);
        }

        .auth-toast {
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 18px;
            display: none;
        }

        .auth-toast-error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #ff7675;

        .auth-toast-success {

            color: #55efc4;
        }

        .auth-footer {
            margin-top: 22px;
            text-align: center;
            font-size: 13px;
            color: var(--text-secondary);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 18px;
        }

        .auth-footer a {
            color: var(--brand-orange);
            font-weight: 700;

        }

        .home-back-link {

            text-decoration: none;
            margin-bottom: 16px;
            transition: color 0.2s ease;
        }

        .home-back-link:hover {
            color: var(--brand-gold);
        }

        @media (max-width: 550px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>

            <button type="submit" id="btnSubmit" class="btn-auth-submit">

            <a href="login.html">පිවිසෙන්න (Sign In)</a>
        </div>

    <script>
        let currentRole = 'student';
        const toast = document.getElementById('authToast');
        const registerForm = document.getElementById('registerForm');
        const btnSubmit = document.getElementById('btnSubmit');

        // Capture referral parameters (?ref=USERNAME&position=left|right)
        const urlParams = new URLSearchParams(window.location.search);
        const refQuery = urlParams.get('ref') || urlParams.get('sponsor');
        const posQuery = urlParams.get('position');

        if (refQuery) {
            localStorage.setItem('hapanamy_referrer', refQuery);
        }
        if (posQuery) {
            localStorage.setItem('hapanamy_ref_position', posQuery.toUpperCase());
        }

        const effectiveSponsor = refQuery || localStorage.getItem('hapanamy_referrer') || 'Hiru';
        const effectivePosition = (posQuery || localStorage.getItem('hapanamy_ref_position') || 'LEFT').toUpperCase();

        const sponsorBadge = document.getElementById('sponsorBadge');
        if (sponsorBadge && effectiveSponsor) {
            document.getElementById('sponsorNameText').textContent = effectiveSponsor;
            document.getElementById('sponsorPosText').textContent = effectivePosition;
            sponsorBadge.style.display = 'flex';
        }

        function selectRole(role) {
            currentRole = role;
            document.getElementById('roleStudent').classList.toggle('active', role === 'student');
            document.getElementById('roleAffiliate').classList.toggle('active', role === 'member');
        }

        function showToast(msg, isError = true) {
            toast.className = `auth-toast ${isError ? 'auth-toast-error' : 'auth-toast-success'}`;
            toast.innerHTML = msg;
            toast.style.display = 'block';
            toast.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        async function sha256Hex(text) {
            const enc = new TextEncoder().encode(text);
            const buf = await crypto.subtle.digest('SHA-256', enc);
            return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        function validateEmail(email) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        }

        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            toast.style.display = 'none';

            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const termsAgreed = document.getElementById('agreeTerms').checked;

            if (!fullName) {
                showToast('⚠️ කරුණාකර ඔබගේ සම්පූර්ණ නම ඇතුළත් කරන්න.');
                return;
            }

            if (!email || !validateEmail(email)) {
                showToast('⚠️ කරුණාකර නිවැරදි විද්‍යුත් තැපැල් (Email) ලිපිනයක් ඇතුළත් කරන්න.');
                return;
            }

            if (!phone || phone.length < 7) {
                showToast('⚠️ කරුණාකර වලංගු දුරකථන අංකයක් ඇතුළත් කරන්න.');
                return;
            }

            if (password.length < 6) {
                showToast('⚠️ මුරපදය සඳහා අවම වශයෙන් අක්ෂර 6ක් ඇතුළත් කරන්න.');
                return;
            }

            if (password !== confirmPassword) {
                showToast('❌ මුරපද නොගැලපේ (Passwords do not match). කරුණාකර නැවත පරීක්ෂා කරන්න.');
                return;
            }

            if (!termsAgreed) {
                showToast('⚠️ ලියාපදිංචි වීමට කරුණාකර සේවා කොන්දේසි වලට එකඟ වන්න.');
                return;
            }

            btnSubmit.disabled = true;
            btnSubmit.innerHTML = '<span>⏳ ලියාපදිංචි කරමින්...</span>';

            const username = email.split('@')[0].replace(/[^a-zA-Z0-9_-]/g, '_');

            // 1. Try Backend API
            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        fullName,
                        username,
                        email,
                        mobile: phone,
                        password,
                        confirmPassword,
                        sponsorCode: effectiveSponsor,
                        position: effectivePosition,
                        role: currentRole,
                        termsAccepted: true,
                        privacyAccepted: true
                    })
                });

                const contentType = response.headers.get('content-type') || '';
                if (contentType.includes('application/json')) {
                    const data = await response.json();
                    if (response.ok && data.success) {
                        const token = data.verification_token || 'token-' + Date.now();
                        localStorage.setItem('auth_token', token);
                        localStorage.setItem('active_token', token);
                        localStorage.setItem('active_user', JSON.stringify(data.user));
                        localStorage.setItem('hapanamy_user_profile', JSON.stringify({
                            id: data.user.id,
                            name: fullName,
                            full_name: fullName,
                            username: data.user.username || username,
                            email: email,
                            phone: phone,
                            role: currentRole,
                            status: 'ACTIVE',
                            sponsor: effectiveSponsor,
                            position: effectivePosition,
                            created_at: new Date().toISOString()
                        }));

                        showToast(`🎉 <strong>ලියාපදිංචිය සාර්ථකයි!</strong> සාදරයෙන් පිළිගනිමු ${fullName}!`, false);
                        setTimeout(() => {
                            window.location.replace('dashboard.html');
                        }, 1000);
                        return;
                    } else if (data.error) {
                        btnSubmit.disabled = false;
                        btnSubmit.innerHTML = '<span>🚀 ලියාපදිංචි වන්න (Create Account)</span>';
                        showToast(`❌ <strong>ලියාපදිංචිය අසාර්ථකයි:</strong> ${data.error}`);
                        return;
                    }
                }
            } catch (err) {
                console.log('Backend API offline, proceeding with local database layer.');
            }

            // 2. Local Storage & Database Adapter Layer (Password NEVER stored in plaintext)
            try {
                let regUsers = JSON.parse(localStorage.getItem('hapanamy_registered_users')) || [];
                const exists = regUsers.some(u => u.email && u.email.toLowerCase() === email.toLowerCase());
                if (exists) {
                    btnSubmit.disabled = false;
                    btnSubmit.innerHTML = '<span>🚀 ලියාපදිංචි වන්න (Create Account)</span>';
                    showToast('⚠️ මෙම විද්‍යුත් තැපෑල (Email) දැනටමත් ලියාපදිංචි කර ඇත. කරුණාකර පිවිසෙන්න (Login).');
                    return;
                }

                const passwordHash = await sha256Hex(password);
                const newUser = {
                    id: 'user-' + Date.now(),
                    name: fullName,
                    full_name: fullName,
                    username: username,
                    email: email,
                    phone: phone,
                    password_hash: passwordHash,
                    role: currentRole,
                    sponsor: effectiveSponsor,
                    position: effectivePosition,
                    status: 'ACTIVE',
                    created_at: new Date().toISOString()
                };

                regUsers.push(newUser);
                localStorage.setItem('hapanamy_registered_users', JSON.stringify(regUsers));

                if (typeof dbAddUser === 'function') {
                    await dbAddUser(newUser);
                }

                // Record under sponsor downline list
                if (effectiveSponsor) {
                    let referredList = JSON.parse(localStorage.getItem('referred_users_' + effectiveSponsor)) || [];
                    referredList.push({
                        name: fullName,
                        username: username,
                        email: email,
                        mobile: phone,
                        position: effectivePosition,
                        role: currentRole,
                        date: new Date().toLocaleDateString(),
                        created_at: new Date().toISOString()
                    });
                    localStorage.setItem('referred_users_' + effectiveSponsor, JSON.stringify(referredList));
                }

                const userSessionToken = 'token-member-' + newUser.id;
                const safeUserProfile = {
                    id: newUser.id,
                    name: fullName,
                    full_name: fullName,
                    username: username,
                    email: email,
                    phone: phone,
                    role: currentRole,
                    sponsor: effectiveSponsor,
                    position: effectivePosition,
                    status: 'ACTIVE',
                    created_at: newUser.created_at
                };

                localStorage.setItem('auth_token', userSessionToken);
                localStorage.setItem('active_token', userSessionToken);
                localStorage.setItem('active_user', JSON.stringify(safeUserProfile));
                localStorage.setItem('hapanamy_user_profile', JSON.stringify(safeUserProfile));

                if (currentRole === 'member' || currentRole === 'affiliate') {
                    localStorage.setItem('hapanamy_affiliate_profile', JSON.stringify({
                        name: fullName,
                        email: email,
                        phone: phone,
                        bankName: 'Commercial Bank',
                        accNumber: '8010294851',
                        status: 'ACTIVE'
                    }));
                }

                showToast(`🎉 <strong>ලියාපදිංචිය සාර්ථකයි!</strong> සාදරයෙන් පිළිගනිමු ${fullName}!`, false);
                setTimeout(() => {
                    window.location.replace('dashboard.html');
                }, 1000);
            } catch (e2) {
                btnSubmit.disabled = false;
                btnSubmit.innerHTML = '<span>🚀 ලියාපදිංචි වන්න (Create Account)</span>';
                showToast('❌ තාක්ෂණික දෝෂයක්. කරුණාකර නැවත උත්සාහ කරන්න.');
            }
        });
    </script>
</body>
</html>
